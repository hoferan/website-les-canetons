services:
  # One-shot init: installs the API's PHP deps into its shared volume, then
  # exits. `web` waits for it via service_completed_successfully, which is why
  # `docker compose up` needs no host-side vendor/ and no manual composer step.
  #
  # It used to install two projects. The old front end's Composer project is
  # gone — Laravel is the only PHP left.
  deps:
    image: composer:2
    volumes:
      - ./docker/web/install-vendor.sh:/install-vendor.sh:ro
      - ./api:/api
      - api_vendor:/api/vendor
    entrypoint: ["sh", "/install-vendor.sh"]
    restart: "no"

  # The Vite dev server for web/, on :5173, proxying /api and /sanctum to the
  # `web` container (see vite.config.ts). The browser therefore sees ONE origin,
  # which is what Sanctum's stateful SPA cookie flow requires — the dev origin is
  # added to SANCTUM_STATEFUL_DOMAINS in docker/api/env.docker only, never in a
  # shipped default.
  #
  # It used to run `vite build --watch` for the old per-page bundles. Those are
  # gone; this is now where you actually develop, with HMR. `npm run build` plus
  # the `web` container still serves the BUILT artifact on :8090 for parity
  # checks and for `npm run smoke`.
  assets:
    image: node:20
    working_dir: /repo
    ports:
      - "5173:5173"
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"

  # ONE container, ONE origin: Apache + PHP-FPM serving the BUILT artifact from a
  # document root shaped exactly like the deployed dist/build/ — the way the real
  # host works. The entrypoint runs Laravel's migrations, the only migration
  # system there is (see docker/web/entrypoint.sh).
  #
  # This serves the built SPA, not the sources. Day-to-day frontend work happens
  # against the Vite dev server on :5173 (the `assets` service above); this is
  # the parity check, and what `npm run smoke` asserts against. Re-run
  # `npm run build` to refresh what it serves.
  #
  # See docs/superpowers/specs/2026-07-25-local-docker-prod-parity-design.md and
  # docs/superpowers/specs/2026-08-28-spa-clean-cutover-and-mocks-design.md.
  web:
    build: ./docker/web
    ports:
      - "8090:80"
    volumes:
      # The built artifact: index.html + assets/, exactly what gets uploaded.
      #
      # NOT :ro, however tempting. The .htaccess mount below lands INSIDE this
      # one, and Docker has to create that mountpoint; against a read-only
      # parent it fails outright with "make mountpoint ...: read-only file
      # system" and the container never starts. (The same nesting is why an
      # empty .htaccess file appears in dist/build/ on the host — Docker creates
      # it there. It is git-ignored, regenerated by every build, and the deploy
      # never uploads a protected basename, so it is harmless.)
      - ./dist/build:/var/www/html
      # Generated by `node tools/build-overlays.mjs docker`, which `npm run dev`
      # chains ahead of `up`. It MUST exist before `up`, or Docker creates a
      # DIRECTORY here instead, and `web` then refuses to start at all ("not a
      # directory: are you trying to mount a directory onto a file?") — the site
      # is down, not silently missing rules. `npm run dev` avoids this because
      # build-overlays.mjs rmSyncs dist/overlay/docker/ before regenerating it.
      - ./dist/overlay/docker/.htaccess:/var/www/html/.htaccess:ro
      # The Laravel project lands at api-laravel/, not api/, and the hyphen is
      # load-bearing: the .htaccess template dispatches with `RewriteRule
      # ^api(/|$) api-laravel/public/index.php [L]`, and only the hyphen stops
      # that substitution from re-matching its own pattern and looping into a
      # 500. tools/build.mjs uses the same name for the same reason — see its
      # comment before renaming either. The URL path /api/* dispatches here.
      - ./api:/var/www/html/api-laravel
      - ./docker/api/env.docker:/var/www/html/api-laravel/.env:ro
      - api_vendor:/var/www/html/api-laravel/vendor
      # The tracked web/ tree, read-only and OUTSIDE the document root, purely
      # so ApiErrorVocabularyTest can read web/src/i18n/fr.ts. That guard asserts
      # every error token the API can emit has French copy, and the document
      # root will hold only the built SPA — hashed bundles, no source. Mounting
      # it under /var/www/html instead would put source in the document root for
      # no reason. See ApiErrorVocabularyTest::I18N_PATHS.
      - ./web:/srv/web:ro
    # No `environment:` block, deliberately. Laravel's configuration comes from
    # the .env mounted above — that is the whole point of Task 5, since it
    # exercises Laravel's real dotenv path and mirrors how each server owns its
    # own .env. Setting DB_HOST here would defeat it: Dotenv::createImmutable
    # does not overwrite real process environment variables, so a compose
    # DB_HOST silently wins over the file and that .env line becomes dead
    # config.
    depends_on:
      deps:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      assets:
        condition: service_started
      mailpit:
        condition: service_started

  db:
    image: mariadb:10.3
    environment:
      MARIADB_DATABASE: lescanetons
      MARIADB_USER: canetons
      MARIADB_PASSWORD: canetons
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    # -h 127.0.0.1, NOT localhost. Against `localhost` mysqladmin uses the unix
    # socket, which succeeds against MariaDB's temporary --skip-networking init
    # server while TCP is still unreachable and the schema is unloaded — a
    # reproducible false positive that can release `web` too early (observed:
    # PASS at t=4s with zero tables, fail at t=5s, PASS for real at t=6s).
    # Forcing TCP makes the check mean what `depends_on: service_healthy` needs
    # it to mean.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  adminer:
    image: adminer:latest
    ports:
      - "8091:8080"
    depends_on:
      - db

volumes:
  db_data:
  api_vendor:
  node_modules:
