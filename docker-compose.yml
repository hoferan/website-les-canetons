services:
  # The PHP tools container, kept running so a PHP command never pays for a
  # cold start. tools/php-runner.mjs execs into it for Pint, Larastan, the
  # OpenAPI export, the Laravel suite and `npm run artisan|composer|php`.
  #
  # Its entrypoint installs the API's Composer dependencies into api_vendor
  # first, then marks the container healthy, and `web` waits for that. This is
  # why `docker compose up` needs no host-side vendor/ and no manual composer
  # step. See docker/php/entrypoint.sh.
  #
  # The whole repository is mounted, not only api/, because the suite reads
  # web/src/i18n (ApiErrorVocabularyTest) and the runner execs with paths
  # relative to the repository root. api_vendor sits over api/vendor, so the
  # volume is the only vendor/ these tools see: a host-side api/vendor, if
  # one exists, is shadowed rather than used.
  php:
    build: ./docker/php
    working_dir: /repo
    init: true
    entrypoint: ["sh", "/repo/docker/php/entrypoint.sh"]
    command: ["sleep", "infinity"]
    volumes:
      - .:/repo
      - api_vendor:/repo/api/vendor
      # The same file `web` reads as its .env, so artisan run here talks to
      # the stack's own database and mail.
      - ./docker/api/env.docker:/repo/api/.env:ro
    # Healthy once the entrypoint's composer install has finished.
    # start_period is the first install from an empty volume, which takes
    # minutes; failures inside it do not count, and the first pass ends it.
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/vendor-ready"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 15m
    depends_on:
      db:
        condition: service_healthy

  # The Vite dev server for web/, on :5173, proxying /api and /sanctum to the
  # `web` container (see vite.config.ts). The browser therefore sees ONE origin,
  # which is what Sanctum's stateful SPA cookie flow requires — the dev origin is
  # added to SANCTUM_STATEFUL_DOMAINS in docker/api/env.docker only, never in a
  # shipped default.
  #
  # It used to run `vite build --watch` for the old per-page bundles. Those are
  # gone; this is now where you actually develop, with HMR. `npm run build` plus
  # the `web` container still serves the BUILT artifact on :8090 for parity
  # checks and for `npm run smoke`.
  assets:
    image: node:20
    working_dir: /repo
    ports:
      - "5173:5173"
    environment:
      # vite.config.ts defaults this to localhost:8090, which is right on the
      # host but wrong here: inside this container localhost is this container.
      # `web` is the compose service name, port 80 inside the network.
      VITE_API_PROXY_TARGET: http://web
      # Bind-mount filesystem events do not reach this container on Docker
      # Desktop, so without polling an edit on the host never triggers HMR and
      # the dev server serves the previous version until it is restarted.
      VITE_USE_POLLING: "1"
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"

  # ONE container, ONE origin: Apache + PHP-FPM serving the BUILT artifact from a
  # document root shaped exactly like the deployed dist/build/ — the way the real
  # host works. The entrypoint runs Laravel's migrations, the only migration
  # system there is (see docker/web/entrypoint.sh).
  #
  # This serves the built SPA, not the sources. Day-to-day frontend work happens
  # against the Vite dev server on :5173 (the `assets` service above); this is
  # the parity check, and what `npm run smoke` asserts against. Re-run
  # `npm run build` to refresh what it serves.
  web:
    build: ./docker/web
    ports:
      - "8090:80"
    volumes:
      # The built artifact: index.html + assets/, exactly what gets uploaded.
      #
      # NOT :ro, however tempting. The .htaccess mount below lands INSIDE this
      # one, and Docker has to create that mountpoint; against a read-only
      # parent it fails outright with "make mountpoint ...: read-only file
      # system" and the container never starts. (The same nesting is why an
      # empty .htaccess file appears in dist/build/ on the host — Docker creates
      # it there. It is git-ignored, regenerated by every build, and the
      # deploy never uploads `.htaccess` at the deploy root — it is an exact
      # protected path — so it is harmless.)
      - ./dist/build:/var/www/html
      # Generated by `node tools/build-overlays.mjs docker`, which `npm run dev`
      # chains ahead of `up`. It MUST exist before `up`, or Docker creates a
      # DIRECTORY here instead, and `web` then refuses to start at all ("not a
      # directory: are you trying to mount a directory onto a file?") — the site
      # is down, not silently missing rules. `npm run dev` avoids this because
      # build-overlays.mjs rmSyncs dist/overlay/docker/ before regenerating it.
      - ./dist/overlay/docker/.htaccess:/var/www/html/.htaccess:ro
      # The Laravel project lands at _api/, not api/, and that matters: the
      # .htaccess template dispatches with `RewriteRule ^api(/|$)
      # _api/public/index.php [L]`, and in per-directory context a substitution
      # re-enters the whole ruleset, so the rule must not match its own output.
      # `^api(/|$)` matches only a path that is EXACTLY `api` or that begins
      # `api/`, so _api/ is safe — as is every name except the literal `api`,
      # which would re-match on every pass and loop into a 500. tools/build.mjs
      # picks the same name for the artifact and carries the full reasoning;
      # read its comment before renaming either, and keep the two in step or
      # the dispatch and the tree it dispatches into disagree. The URL path
      # /api/* dispatches here.
      - ./api:/var/www/html/_api
      - ./docker/api/env.docker:/var/www/html/_api/.env:ro
      - api_vendor:/var/www/html/_api/vendor
    # No `environment:` block, deliberately. Laravel's configuration comes from
    # the .env mounted above — that mount is the whole point, since it
    # exercises Laravel's real dotenv path and mirrors how each server owns its
    # own .env. Setting DB_HOST here would defeat it: Dotenv::createImmutable
    # does not overwrite real process environment variables, so a compose
    # DB_HOST silently wins over the file and that .env line becomes dead
    # config.
    depends_on:
      php:
        condition: service_healthy
      db:
        condition: service_healthy
      assets:
        condition: service_started
      mailpit:
        condition: service_started

  db:
    image: mariadb:10.3
    environment:
      MARIADB_DATABASE: lescanetons
      MARIADB_USER: canetons
      MARIADB_PASSWORD: canetons
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    # -h 127.0.0.1, NOT localhost. Against `localhost` mysqladmin uses the unix
    # socket, which succeeds against MariaDB's temporary --skip-networking init
    # server while TCP is still unreachable and the schema is unloaded — a
    # reproducible false positive that can release `web` too early (observed:
    # PASS at t=4s with zero tables, fail at t=5s, PASS for real at t=6s).
    # Forcing TCP makes the check mean what `depends_on: service_healthy` needs
    # it to mean.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  # The database UI, on :8091. It opens straight into `lescanetons` with no
  # login — the whole point of the swap away from Adminer, which asked for
  # server, user, password and database on every single visit.
  #
  # ADMINER CANNOT BE PRE-CONFIGURED FOR THIS, which is why the tool changed
  # rather than the config. Measured 2026-09-12 against adminer:latest (6.0.1):
  # ADMINER_DEFAULT_SERVER prefills the server field and nothing else; a plugin
  # implementing credentials() does NOT skip the form (it exists so a password
  # prompt can stand in front of hidden real credentials); and injecting
  # $_POST['auth'] — from a plugin's require-time side effect or as a literal
  # POST — is refused by a CSRF token check. Auto-login would have meant forging
  # Adminer's session internals against a floating tag.
  #
  # The credentials below are the same ones already sitting in the `db` service.
  # Nothing here is a secret this file did not already hold.
  dbgate:
    image: dbgate/dbgate:7.2.6-alpine
    ports:
      - "8091:3000"
    environment:
      CONNECTIONS: canetons
      LABEL_canetons: Les Canetons (local)
      SERVER_canetons: db
      PORT_canetons: "3306"
      USER_canetons: canetons
      PASSWORD_canetons: canetons
      ENGINE_canetons: mysql@dbgate-plugin-mysql
    volumes:
      # Open tabs, saved queries — and `.key`, the secret DbGate signs its
      # browser token with. Without this volume that key is regenerated on
      # every recreate, and an already-open tab then spams
      # "DBGM-00098 Sending invalid token error" until you hard-reload.
      - dbgate_data:/root/.dbgate
    depends_on:
      - db

volumes:
  db_data:
  dbgate_data:
  api_vendor:
  node_modules:
