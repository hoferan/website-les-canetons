<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Action bar family</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ground:#fff7ec; --ink:#14121c; --muted:#5a5768; --line:#e2e3ea; --violet:#4b2ed6; --danger:#e0201a;
    --yellow:#ffd23f; --yellow-h:#f2bd1f; --cyan:#2ee6d6; --pink:#ff3d9a; --lime:#b6f23a; --lilac:#b9a8ff; --stage:#0b0a12; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Karla",system-ui,sans-serif; color:var(--ink); background:#d9d6cf; }
  svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2.25; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  section { padding:20px 28px; }
  .cap { font-weight:800; font-size:16px; margin:0 0 10px; }
  .cap small { display:block; font-weight:500; color:var(--muted); font-size:14px; }
  .row { display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; }

  /* ActionBar: segments in one frame. The open one shows its word. */
  .bar { display:flex; height:46px; }
  .seg { position:relative; display:flex; align-items:center; justify-content:center; gap:6px; padding:0 9px; flex:0 0 32px;
    font-weight:800; font-size:14px; white-space:nowrap; }
  .seg + .seg { border-left:3px solid var(--ink); }
  .seg.open { flex:1 1 auto; }
  .seg .w { display:none; } .seg.open .w { display:inline; }
  .seg.off svg { opacity:.3; }
  .seg.hover { background:var(--yellow-h); }

  /* strip: a list item's top edge */
  .strip { position:absolute; left:0; right:0; top:0; background:var(--yellow); border-radius:17px 17px 0 0; overflow:hidden; border-bottom:3px dashed var(--ink); }
  /* chip: a single block's corner, the same parts in a floating frame */
  .chip { color:var(--ink); position:absolute; top:10px; right:10px; background:var(--yellow); border:3px solid var(--ink); border-radius:12px; box-shadow:3px 3px 0 var(--ink); height:44px; }
  .chip .seg { flex:0 0 auto; padding:0 12px; }
  /* row: a line inside an editor panel, quiet, white */
  .rowbar { display:flex; height:40px; border:2px solid var(--ink); border-radius:10px; overflow:hidden; background:#fff; }
  .rowbar .seg { flex:0 0 40px; padding:0; } .rowbar .seg + .seg { border-left:2px solid var(--ink); }

  /* The three markers for "a text without German" */
  .m1 .mk { position:absolute; width:11px; height:11px; border-radius:99px; background:var(--cyan); border:2px solid var(--ink); top:-5px; right:-6px; }
  .m1 .ic { position:relative; display:inline-flex; margin-right:5px; }
  /* The flag, after the review: 14px (12px on a folded tab), a 3px ink
     diagonal that carries the contrast, clipped by whatever frame it sits in. */
  .m2 .mk { position:absolute; top:0; left:0; width:var(--f, 14px); height:var(--f, 14px); background:linear-gradient(135deg, var(--cyan) 0 calc(50% - 1.5px), var(--ink) calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)); }
  .m2 .seg:not(.open) { --f:12px; }
  .m2.chip { overflow:hidden; }
  /* An open segment wider than its word starts its content next to the flag. */
  .strip .seg.open { justify-content:flex-start; padding-left:16px; }
  .m3 .mk { position:absolute; bottom:-9px; left:50%; width:14px; height:14px; margin-left:-7px; border-radius:99px; background:var(--cyan); border:2px solid var(--ink); z-index:2; }
  .m3 .strip { overflow:visible; }
  .chip.m3 .mk { bottom:-9px; }

  /* Page parts */
  .band { position:relative; background:var(--yellow); padding:28px 24px 32px; }
  .ground { position:relative; background:var(--ground); padding:28px 24px 32px; }
  .tiles { display:grid; gap:20px; list-style:none; margin:0; padding:0; }
  .tile { position:relative; background:#fff; border:3px solid var(--ink); border-radius:20px; box-shadow:5px 5px 0 var(--ink); padding:64px 16px 18px; min-height:200px; }
  .tilt > li:nth-child(odd) .tile { transform:rotate(-1.2deg); }
  .tilt > li:nth-child(even) .tile { transform:rotate(1deg); }
  .glyph { width:52px; height:52px; display:grid; place-items:center; border:3px solid var(--ink); border-radius:14px; margin-bottom:12px; }
  .glyph svg { width:28px; height:28px; }
  h3 { font-family:"Bungee"; font-weight:400; font-size:19px; text-transform:uppercase; margin:0 0 8px; line-height:1.15; }
  p { margin:0; color:var(--muted); line-height:1.45; }
  .hero { position:relative; background:var(--stage); color:#fff; padding:40px 28px 44px; border-radius:6px; }
  .hero h1 { font-family:"Bungee"; font-weight:400; font-size:34px; margin:0 0 8px; }
  .hero p { color:#d6d3e2; }
  .entry { position:relative; background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:5px 5px 0 var(--ink); padding:64px 18px 18px; }
  .entry .year { font-family:"Bungee"; font-size:15px; color:var(--violet); }
  .panel { width:400px; background:#fff; border-left:3px solid var(--ink); padding:18px 22px; }
  .rowbox { border:3px solid var(--ink); border-radius:16px; padding:12px 14px 16px; display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
  .rh { display:flex; align-items:center; justify-content:space-between; font-weight:800; font-size:16px; }
  .input { height:44px; border:1px solid var(--line); border-radius:8px; }
  .lbl { font-size:15px; margin-bottom:4px; display:flex; gap:6px; align-items:center; }
  .badge { border:2px solid var(--ink); border-radius:6px; font-size:11px; font-weight:800; padding:0 4px; }
  .tag { display:inline-block; font-weight:800; font-size:12px; letter-spacing:.06em; text-transform:uppercase; background:var(--ink); color:#fff; padding:3px 8px; border-radius:6px; margin-bottom:8px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = {
  left:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>', right:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  up:'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>', down:'<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
  pencil:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>',
  more:'<circle cx="12" cy="12" r="1.2"/><circle cx="5" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  drum:'<path d="m2 2 8 8"/><path d="m22 2-8 8"/><ellipse cx="12" cy="9" rx="10" ry="5"/><path d="M7 13.4v7.9"/><path d="M12 14v8"/><path d="M17 13.4v7.9"/><path d="M2 9v8a10 5 0 0 0 20 0V9"/>',
  star:'<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>',
  chat:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
};
const i = (k) => `<svg viewBox="0 0 24 24">${P[k]}</svg>`;
const q = new URLSearchParams(location.search);
const view = q.get("view") || "markers";

// One segment. `marker` puts the "no German" mark on it, the way option m shows it.
const seg = ({ icon, word, open, off, hover, marker, m }) => {
  const iconHtml = marker && m === "m1" ? `<span class="ic">${i(icon)}<span class="mk"></span></span>` : i(icon);
  const mk = marker && m !== "m1" ? '<span class="mk"></span>' : "";
  return `<span class="seg${open ? " open" : ""}${off ? " off" : ""}${hover ? " hover" : ""}">${mk}${iconHtml}${word ? `<span class="w">${word}</span>` : ""}</span>`;
};
const cardSegs = (first, last, opts = {}) => [
  { icon: opts.stacked ? "up" : "left", word: "Avant", off: first },
  { icon: opts.stacked ? "down" : "right", word: "Après", off: last },
  { icon: "more" },
  { icon: "pencil", word: "Modifier", open: true, marker: opts.marker, m: opts.m },
];
const strip = (segs, m = "") => `<div class="strip bar ${m}">${segs.map((s) => seg({ ...s, m })).join("")}</div>`;
const tile = (title, glyph, color, text, segs, m) => `<li><div class="tile">${strip(segs, m)}<span class="glyph" style="background:${color}">${i(glyph)}</span><h3>${title}</h3><p>${text}</p></div></li>`;

const root = document.getElementById("root");
if (view === "flags") {
  // The corner flag (option 2) wherever a pencil can carry it, in every state.
  const m = "m2";
  const S = (segs, extra = "") => `<div class="strip bar ${m} ${extra}">${segs.map((s) => seg({ ...s, m })).join("")}</div>`;
  const card = (segs, w = 237, title = "Notre histoire", extra = "") => `<div class="tile" style="width:${w}px; min-height:150px; padding-top:64px">${S(segs, extra)}<h3>${title}</h3><p>Née en 2002.</p></div>`;
  const base = (o = {}) => [
    { icon: "left", word: "Avant", open: o.open === "before", hover: o.open === "before" },
    { icon: "right", word: "Après" },
    { icon: "more" },
    { icon: "pencil", word: o.de ? "Bearbeiten" : "Modifier", open: !o.open || o.open === "edit", marker: true, hover: o.hoverEdit },
  ];
  const chip = (word, o = {}) => `<div class="chip bar ${m} ${o.cls || ""}" style="position:relative; top:0; right:0; display:inline-flex; overflow:hidden; ${o.style || ""}">${seg({ icon: "pencil", word, open: true, marker: true, m })}</div>`;
  const cells = [
    ["Card strip · at rest", card(base())],
    ["Card strip · pencil hovered", card(base({ hoverEdit: true }))],
    ["Card strip · another opened, ✎ folded", card(base({ open: "before" }))],
    ["Card strip · ✎ keyboard focus (inverted)", card(base(), 237, "Notre histoire", "focus-edit")],
    ["Card strip · German, 270px tile", card(base({ de: true }), 270)],
    ["Card strip · phone, every word shown", card([{ icon: "up", word: "Avant", open: true }, { icon: "down", word: "Après", open: true }, { icon: "more" }, { icon: "pencil", word: "Modifier", open: true, marker: true }], 358)],
    ["History entry strip · ⋯ ✎", card([{ icon: "more" }, { icon: "pencil", word: "Modifier", open: true, marker: true }], 358, "La fondation")],
    ["Single block chip on cream · icon only", `<div class="ground" style="width:237px; padding:20px; text-align:right">${chip("")}</div>`],
    ["Single block chip on cream · word shown", `<div class="ground" style="width:237px; padding:20px; text-align:right">${chip("Modifier")}</div>`],
    ["Chip · keyboard focus (inverted)", `<div class="ground" style="width:237px; padding:20px; text-align:right">${chip("Modifier", { cls: "focus-chip" })}</div>`],
    ["Footer chip on the black stage", `<div class="hero" style="width:237px; padding:20px; text-align:right">${chip("Modifier le site", { style: "box-shadow:3px 3px 0 var(--pink)" })}</div>`],
    ["Chip on the yellow band", `<div class="band" style="width:237px; padding:20px; text-align:right">${chip("")}</div>`],
  ];
  root.innerHTML = `<section><p class="cap">Corner flag, every place and state</p><div style="display:grid; grid-template-columns:repeat(3, 400px); gap:22px 28px">${cells
    .map(([name, html]) => `<div><p class="cap" style="font-size:14px">${name}</p><div style="background:#efece6; padding:14px; border-radius:8px">${html}</div></div>`).join("")}</div></section>`;
  // Focus look: the segment inverts, as in the prototype.
  document.querySelectorAll(".focus-edit .seg:last-child, .focus-chip .seg").forEach((s) => { s.style.background = "var(--ink)"; s.style.color = "var(--yellow)"; });
} else if (view === "markers") {
  const opts = [["m1", "1 · Dot on the pencil", "The mark sits on the icon, not on a corner. The same on the strip and on a single block's chip."],
    ["m2", "2 · Corner flag", "A cyan triangle in the ✎ slot's square top-left corner, a folded-down ticket corner."],
    ["m3", "3 · Punched hole", "A cyan hole on the perforation under ✎, as if the ticket were punched."]];
  root.innerHTML = `<section><div class="row">${opts.map(([m, name, note]) => `
    <div style="width:330px"><p class="cap">${name}<small>${note}</small></p>
      <div class="band" style="padding:24px 40px 28px"><ul class="tiles" style="grid-template-columns:237px">
        ${tile("Notre histoire", "star", "#b6f23a", "Comment la guggen est née en 2002.", cardSegs(false, false, { marker: true, m }), m)}</ul></div>
      <div class="hero" style="margin-top:16px; padding:70px 20px 24px"><div class="chip bar ${m}">${seg({ icon: "pencil", word: "Modifier", open: true, marker: true, m })}</div>
        <h1 style="font-size:24px">Nous rejoindre</h1><p>Un bloc seul : une action.</p></div>
    </div>`).join("")}</div></section>`;
} else {
  const phone = view === "family-phone";
  const W = phone ? 358 : 270;
  const heroChip = `<div class="chip bar m2">${seg({ icon: "pencil", word: phone ? "" : "Modifier", open: true })}</div>`;
  const tiles = (phone ? [["Nous rejoindre", "music", "#ff3d9a", "Les instruments recherchés."], ["Les canetons", "drum", "#2ee6d6", "Les musiciens du groupe."]]
    : [["Nous rejoindre", "music", "#ff3d9a", "Les instruments recherchés."], ["Les canetons", "drum", "#2ee6d6", "Les musiciens du groupe."], ["Notre histoire", "star", "#b6f23a", "Née en 2002."], ["Le comité", "chat", "#b9a8ff", "Nous écrire."]]);
  const labelAll = phone;
  const cardRow = tiles.map(([t, g, c, p], n) => {
    const s = cardSegs(n === 0, n === tiles.length - 1, { stacked: phone, marker: n === 2, m: "m2" });
    if (labelAll) s.forEach((x) => (x.open = x.icon !== "more"));
    return tile(t, g, c, p, s, "m2");
  }).join("");
  const entrySegs = [{ icon: "more" }, { icon: "pencil", word: "Modifier", open: true }];
  const entry = (year, title, text) => `<li><div class="entry">${strip(entrySegs)}<span class="year">${year}</span><h3 style="margin-top:4px">${title}</h3><p>${text}</p></div></li>`;
  const rowbar = `<div class="rowbar">${[{ icon: "up" }, { icon: "down", off: true }, { icon: "more" }].map((s) => seg(s)).join("")}</div>`;
  root.innerHTML = `
  <section><p class="cap">One pattern, four places${phone ? " · 390px" : " · 1280px"}<small>Single block: a chip with its one action. A list item on the page: a strip with the same slots on every item. A line inside an editor: the same bar, quiet. The extra actions always sit behind ⋯, the main one is always labelled.</small></p>
  <div style="display:flex; flex-direction:column; gap:18px; width:${phone ? 390 : 1240}px">
    <div><span class="tag">Single block · chip, 1 action</span><div class="hero">${heroChip}<h1>Nous rejoindre</h1><p>Tu as entre 7 et 18 ans ? Viens jouer avec nous.</p></div></div>
    <div><span class="tag">List on the page · strip, ← → ⋯ ✎</span><div class="band"><ul class="tiles tilt" style="grid-template-columns:repeat(${phone ? 1 : 4}, ${W}px)">${cardRow}</ul></div></div>
    <div><span class="tag">List on the page, fixed order · strip, ⋯ ✎</span><div class="ground"><ul class="tiles" style="grid-template-columns:repeat(${phone ? 1 : 2}, ${phone ? 358 : 560}px)">${entry("2002", "La fondation", "Une poignée de parents lancent la guggen.")}${phone ? "" : entry("2012", "Dix ans", "Premier voyage au carnaval de Bâle.")}</ul></div></div>
    <div><span class="tag">List inside an editor · row bar, ↑ ↓ ⋯</span><div style="display:flex; background:var(--ground)"><div class="panel" style="${phone ? "width:390px; border-left:0" : ""}">
      <div class="rowbox"><div class="rh">Téléphone ${rowbar}</div><div><div class="lbl">Libellé <span class="badge">FR</span></div><div class="input"></div></div><div><div class="lbl">Numéro</div><div class="input"></div></div></div>
    </div></div></div>
  </div></section>`;
}
</script>
</body>
</html>
