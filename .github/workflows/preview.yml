name: Preview

# A running copy of each PR's SPA on GitHub Pages, so a reviewer clicks
# through a change on a laptop or a phone instead of checking out the branch
# (#353). At https://hoferan.github.io/website-les-canetons/pr-<n>/, against
# the mocked backend in web/src/mocks/: no PHP, no database, fixture data
# only. The design system's Storybook sits beside it at pr-<n>/storybook/.
# The repository is public, so the preview is too; that is accepted because
# nothing in it is real, and every page carries noindex.
#
# Published from the gh-pages branch, one directory per PR, removed when the
# PR closes. actions/deploy-pages replaces the whole site on every run, so one
# PR's preview would wipe the others'. Pages must be set to deploy from
# gh-pages once, in the repository settings.
#
# How the app runs under a subpath: vite.config.ts (preview mode) and
# tools/build-preview.mjs. How a deep link finds its PR on a host with no
# rewrite rules: config/preview-pages/404.html.
#
# INFORMATIONAL, AND A WORKFLOW OF ITS OWN FOR THAT REASON, as
# lighthouse.yml is: ci.yml's all-green is the one required check on main
# and must need every job in that file.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Per PR. A push cancels its PR's build in flight; a close never cancels and
# waits its turn, or a closed PR could keep its preview. Several PRs still
# write to the one gh-pages branch, which the push below retries for. A
# concurrency group shared by every PR would not do: GitHub keeps one pending
# run per group and cancels the rest, removals included.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read

jobs:
  build:
    # A fork's PR gets a read-only token, so publishing could only fail.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dev tools
        run: npm ci
      - name: Build the preview
        env:
          PR: ${{ github.event.pull_request.number }}
        run: npm run build:preview -- "$PR"
      # Laid out as the root of gh-pages, so the publishing job copies it over
      # and runs nothing from the repository.
      - name: Lay out the site
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p dist/pages
          mv dist/preview "dist/pages/pr-$PR"
          cp config/preview-pages/404.html dist/pages/404.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: dist/pages/
          retention-days: 1

  # A job of its own so that the write permissions stay out of the job that
  # runs npm ci: this one runs no code from the repository.
  publish:
    needs: build
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - if: github.event.action != 'closed'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: site
      # Replaces pr-<n>/ on gh-pages, or removes it when the PR closed.
      #
      # gh-pages is always ONE commit with no parent, holding every open PR's
      # preview, force-pushed over the last. Each push brings a few MB of new
      # hashed bundles, and a plain clone fetches every branch, so a history
      # would grow every checkout for previews nobody opens again.
      #
      # The force push carries a lease on the commit it was built from. If
      # another PR pushed in between, the lease fails, and the next attempt
      # starts from a fresh fetch and redoes this PR's one directory on top of
      # theirs. Without the lease, the faster PR's preview would be lost.
      - name: Update gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          dir="pr-$PR"
          site="$PWD/site"
          git init -q pages
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          if [ "$ACTION" = closed ]; then
            message="Remove the preview of PR #$PR"
          else
            message="Preview PR #$PR at ${SHA::7}"
          fi

          # The open PRs' titles and branches, for the index. Read once: the
          # loop below may run several times, the list does not change.
          prs="$PWD/../open-prs.json"
          gh pr list --repo "$REPO" --state open --limit 200 \
            --json number,title,headRefName,url > "$prs"

          # index.html at the root lists every preview on the branch, newest
          # PR first. Built from the pr-* directories actually there, so it
          # cannot list a preview that is gone. Titles are whatever a PR's
          # author typed, so @html escapes every value put into the page.
          write_index() {
            local numbers items
            numbers=$(find . -maxdepth 1 -type d -name 'pr-*' | sed 's#^\./pr-##' \
              | { grep -E '^[0-9]+$' || true; } | sort -rn | jq -R 'tonumber' | jq -s .)
            items=$(jq -r --argjson numbers "$numbers" '
              (map({key: (.number | tostring), value: .}) | from_entries) as $open
              | $numbers[]
              | ($open[tostring] // {number: ., title: "(closed)", headRefName: "", url: ""}) as $p
              | @html "<li><a class=\"title\" href=\"pr-\(.)/\">\($p.title)</a><span class=\"meta\">#\(.) \($p.headRefName)</span><span class=\"links\"><a href=\"pr-\(.)/\">FR</a><a href=\"pr-\(.)/de/\">DE</a><a href=\"pr-\(.)/storybook/\">Storybook</a><a href=\"\($p.url)\">PR</a></span></li>"
            ' "$prs")
            if [ -z "$items" ]; then
              items='<li class="none">No open previews.</li>'
            fi
            cat > index.html <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="robots" content="noindex" />
              <title>PR previews</title>
              <style>
                body { margin: 0; background: #0b0b14; color: #fff; font: 16px/1.5 system-ui, sans-serif; }
                main { max-width: 44rem; margin: 0 auto; padding: 2.5rem 1rem; }
                h1 { margin: 0; font-size: 1.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; }
                p { color: #b9b9c8; margin: .5rem 0 2rem; }
                ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
                li { display: grid; gap: .25rem; padding: 1rem 1.25rem; border-radius: .75rem; background: #17172a; border-left: 4px solid #ff3d9a; }
                li.none { border-left-color: #55556a; color: #b9b9c8; }
                a { color: #fff; }
                .title { font-weight: 700; font-size: 1.05rem; text-decoration: none; }
                .title:hover { text-decoration: underline; }
                .meta { color: #b9b9c8; font-size: .875rem; overflow-wrap: anywhere; }
                .links { display: flex; gap: .5rem; margin-top: .25rem; }
                .links a { padding: .125rem .625rem; border: 1px dashed #ffffffb0; border-radius: .375rem; font-size: .8rem; font-weight: 700; text-decoration: none; }
                .links a:hover { background: #ff3d9a; color: #14121c; border-style: solid; }
              </style>
            </head>
            <body>
              <main>
                <h1>PR previews</h1>
                <p>One running copy of the SPA per open pull request, against mocked data. Log in with any demo account, password <code>demo</code>.</p>
                <ul>
          ${items}
                </ul>
              </main>
            </body>
          </html>
          HTML
          }

          for attempt in 1 2 3 4 5; do
            # Exit code 2 is "no such branch": the first preview ever.
            status=0
            git ls-remote --exit-code origin gh-pages > /dev/null || status=$?
            if [ "$status" = 0 ]; then
              git fetch -q --depth 1 origin gh-pages
              # Forced and cleaned: after a lost race the tree still holds the
              # failed attempt, index.html included, which a plain checkout
              # refuses to overwrite.
              git checkout -q -f -B gh-pages FETCH_HEAD
              git clean -q -fdx
              lease="gh-pages:$(git rev-parse FETCH_HEAD)"
            elif [ "$status" = 2 ]; then
              git checkout -q --orphan gh-pages
              # An empty expected value: the branch must still not exist.
              lease="gh-pages:"
            else
              exit "$status"
            fi

            rm -rf "$dir"
            if [ "$ACTION" != closed ]; then
              cp -R "$site/$dir" "$dir"
              cp "$site/404.html" 404.html
              # Jekyll would drop every file whose name starts with an
              # underscore, which a bundler's chunk names can.
              touch .nojekyll
            fi
            write_index

            git add -A
            if git diff --cached --quiet; then
              echo "gh-pages already holds this."
              exit 0
            fi
            commit=$(git commit-tree "$(git write-tree)" -m "$message")
            if git push -q --force-with-lease="$lease" origin "$commit:refs/heads/gh-pages"; then
              echo "$message: pushed."
              exit 0
            fi
            echo "Another PR pushed first; retrying ($attempt)."
            sleep $((attempt * 3))
          done
          echo "Could not push to gh-pages."
          exit 1
      # One comment per PR, found by the marker on its first line and edited
      # in place. Informational, so a failure to post leaves the run green.
      - name: Link the preview from the PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- pr-preview -->'
          url="https://${OWNER}.github.io/${REPO#*/}/pr-$PR/"
          if [ "$ACTION" = closed ]; then
            body="$marker
          ### Preview

          Removed when this PR closed. [Run]($RUN_URL)"
          else
            body="$marker
          ### Preview

          [Open the preview]($url), French at the root and German under [\`de/\`](${url}de/). The design system's stories are in [Storybook](${url}storybook/). Built from ${SHA::7}. Pages takes a minute or two to publish it after this comment appears.

          It runs against the mocked backend in \`web/src/mocks/\`, inside your browser: nothing reaches a server, and a reload resets the data but keeps you logged in. If a page ever loads without its data, reload it normally: a hard reload (Ctrl+Shift+R) can bypass the mocks.

          Log in with the password \`demo\` as:

          | Login | Can |
          | --- | --- |
          | \`demo.direction\` | manage everything; plays in no register |
          | \`demo.player\` | answer events, nothing more |
          | \`demo.both\` | answer and manage; must change the password first |
          | \`demo.committee\` | read the guest lists and the inbox |
          | \`demo.young\` | answer events, as a parent would for a child |

          The preview is removed when the PR closes. [Run]($RUN_URL)"
          fi

          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
            echo "Updated comment $id."
          elif [ "$ACTION" != closed ]; then
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
            echo "Posted a new comment."
          fi
