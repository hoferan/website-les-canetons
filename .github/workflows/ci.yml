name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repo (checkout + lint/test/build).
# None write via GITHUB_TOKEN, so restrict it to read-only contents for all jobs.
permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - name: Install PHP dev tools
        run: composer install --no-interaction --no-progress
      - name: PHP syntax check (php -l)
        run: |
          find app -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l
      - name: PHP_CodeSniffer (PSR-12)
        run: vendor/bin/phpcs
      # phpcs.xml scopes only app/ (the old app), so the Laravel tree at api/
      # gets its own formatter gate: Laravel Pint, pinned by api/composer.lock.
      # Pint lives in api/vendor/, which the root install above does not
      # provide, hence the second install. --no-scripts skips Laravel's
      # post-autoload-dump `artisan package:discover`, which Pint doesn't need.
      - name: Install Laravel API dev tools
        run: composer install --no-interaction --no-progress --no-scripts --working-dir=api
      # Same check as `npm run lint:api`, invoked natively like the phpcs step
      # above: CI calls the binaries directly, while the npm scripts are the
      # local Docker-or-native wrapper (tools/pint.mjs).
      - name: Laravel Pint (api/)
        working-directory: api
        run: vendor/bin/pint --test

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    services:
      mariadb:
        image: mariadb:10.3
        env:
          MARIADB_DATABASE: lescanetons_test
          MARIADB_USER: canetons
          MARIADB_PASSWORD: canetons
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mysqli
          tools: composer
      - name: Install PHP dev tools
        run: composer install --no-interaction --no-progress
      - name: Seed test database
        run: |
          mysql -h 127.0.0.1 -u root -proot lescanetons_test < docker/db/init/01-schema.sql
          mysql -h 127.0.0.1 -u root -proot lescanetons_test < docker/db/init/02-seed.sql
      - name: PHPUnit
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USER: canetons
          TEST_DB_PASS: canetons
          TEST_DB_NAME: lescanetons_test
        run: vendor/bin/phpunit --log-junit=junit.xml
      - uses: actions/setup-node@v5
        if: always()
        with:
          node-version: "22"
      - name: Test result summary
        if: always()
        run: node tools/phpunit-summary.mjs junit.xml | tee test-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment test summary on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: phpunit
          path: test-summary.md
      - name: Publish PHPUnit check
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: junit.xml
          check_name: PHPUnit
          detailed_summary: true
          include_passed: false

  # The Laravel API at api/ has its own PHPUnit suite (api/phpunit.xml); the
  # `tests` job above covers only the old app, against lescanetons_test. Kept a
  # separate job rather than extra steps on `php` or `tests` so it runs
  # concurrently: it needs its own database (laravel_api_test must stay
  # dedicated — RefreshDatabase drops every table) and its own Composer
  # install, and folding it into `php` would serialise install + DB startup +
  # suite onto the lint job, lengthening deploy-test's critical path for no
  # gain. `php` is already ~40s slower from the api install added for Pint.
  tests-api:
    runs-on: ubuntu-latest
    services:
      mariadb:
        # 10.3 matches prod (10.3.8) and the local stack's `db` service, so the
        # migrations run against the same engine everywhere. The image grants
        # MARIADB_USER all rights on MARIADB_DATABASE — the whole of what
        # docker/db/init/00-databases.sql does locally for this database. No
        # seeding: RefreshDatabase builds the schema from Laravel's migrations,
        # including the `cache` table that CACHE_STORE=database needs for the
        # Altcha replay guard.
        image: mariadb:10.3
        env:
          MARIADB_DATABASE: laravel_api_test
          MARIADB_USER: canetons
          MARIADB_PASSWORD: canetons
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # Laravel talks to MariaDB over PDO, not mysqli (what the `tests` job
          # needs for the old app). Every other extension the api/composer.lock
          # tree requires is in setup-php's defaults.
          extensions: pdo_mysql
          tools: composer
      # The api install is the slow part of this job and now happens in two
      # jobs (here and `php`). Cache Composer's download cache, keyed by the
      # lockfile; a miss just falls back to a full install. The root installs in
      # `php`/`tests` are still uncached — worth doing, but that means editing
      # existing jobs, so it is left as a separate change.
      - name: Cache Composer downloads (api/)
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-api-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-api-
      # Same install as the `php` job's Pint step. --no-scripts skips Laravel's
      # `artisan package:discover`; PackageManifest rebuilds
      # bootstrap/cache/packages.php lazily on first boot, so the suite is
      # unaffected (verified locally by deleting the manifest and re-running).
      - name: Install Laravel API dependencies
        run: composer install --no-interaction --no-progress --no-scripts --working-dir=api
      - name: PHPUnit (api/)
        working-directory: api
        env:
          # api/phpunit.xml pins DB_HOST=db, the compose service name, which
          # does not resolve on a runner. PHPUnit's <env> entries default to
          # force="false" and only putenv() when getenv() returns false
          # (src/TextUI/Configuration/PhpHandler.php:140 in phpunit 12.5.31), so
          # a variable already in the process environment wins. Overriding here
          # leaves phpunit.xml correct for local dev, where the suite runs
          # inside the web container. Service-container ports are published on
          # the runner's loopback, so 127.0.0.1 — same as the `tests` job.
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          # No .env exists on a runner: api/.env is git-ignored and the local
          # stack mounts docker/api/env.docker over it. Without APP_KEY the
          # encrypter throws "No application encryption key has been specified"
          # and every cookie/session test fails. Throwaway CI-only key, public
          # on purpose exactly like the one in docker/api/env.docker — it signs
          # nothing that outlives the job, and must never be used on a server.
          APP_KEY: base64:oxt8P89lrI3WQgV89r3v9/9NNrgLipYqKNezzVvHmyk=
        run: vendor/bin/phpunit

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Node dev tools
        run: npm ci
      - name: JS unit tests
        run: npm run test:js
      - name: ESLint
        run: npm run lint:js
      - name: Stylelint
        run: npm run lint:css
      - name: Prettier
        run: npm run format:check

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Secret / prod-data guard
        run: node tools/secret-guard.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Node dev tools
        run: npm ci
      - name: Build deploy artifact
        run: npm run build
      - name: Verify dist/build/ was produced
        run: test -f dist/build/index.php && test -d dist/build/vendor

  # Auto-deploy the built artifact to the TEST staging site on merge to main,
  # only after every other job is green. The FTP account can also reach qa/prod,
  # so: secrets live in the `test` GitHub Environment (add protection rules
  # there), deploy-test hard-refuses any target path without "test", and the
  # mirror's deletions are bounded by the mass-delete safety brake (exit 2).
  deploy-test:
    runs-on: ubuntu-latest
    needs: [php, tests, tests-api, assets, guard, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Install Node dev tools
        run: npm ci
      - name: Deploy to TEST over FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: npm run deploy:test
