name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repo (checkout + lint/test/build).
# None write via GITHUB_TOKEN, so restrict it to read-only contents for all jobs.
permissions:
  contents: read

jobs:
  # Is there anything outside docs/ in this change?
  #
  # A docs-only change cannot break the build, the API or the browser, so making
  # it wait through six jobs and then DEPLOY TO TEST is pure cost — the E2a
  # handover update was a 136-line Markdown diff that redeployed a byte-identical
  # artifact.
  #
  # WHY THIS IS A JOB RATHER THAN `paths-ignore:` ON THE TRIGGER ABOVE, which is
  # the shorter way to write it and is a trap:
  #
  #   1. `paths-ignore` stops the workflow existing at all, so `guard` would not
  #      run either. That job greps the WHOLE tracked tree for prod dumps and
  #      credentials, and `docs/prod-2026.sql` is a docs-only change. It is 10
  #      seconds; it stays unconditional.
  #   2. A job skipped by `if:` still REPORTS, as "skipped". A job that never
  #      triggers reports nothing at all — so the day anyone turns on branch
  #      protection with required checks, every docs PR would sit forever
  #      "waiting for a status to be reported" and could never be merged. main
  #      is unprotected today, which is exactly why this is worth getting right
  #      now rather than debugging later.
  #
  # deploy-test needs every gated job, and GitHub skips a job whose `needs` were
  # skipped — so a docs-only push to main skips the deploy without that job
  # needing to know anything about docs/.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The default shallow clone has no base commit to diff against.
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            range="origin/$BASE_REF...HEAD"
          elif [ -n "${BEFORE:-}" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            # A new branch, a force-push, or a rewritten base: there is nothing
            # honest to diff against, so run everything. Every unknown here
            # fails TOWARDS running the pipeline, never towards skipping it.
            echo "No usable base commit — running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$range")"
          echo "Changed files:"
          echo "$files" | sed 's/^/  /'

          if [ -z "$files" ]; then
            echo "Empty diff — running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$files" | grep -qvE '^docs/'; then
            echo "Result: changes outside docs/ — running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            # Note this is docs/ ONLY. CLAUDE.md, README.md and staging/README.md
            # sit outside it and still run everything, deliberately: CLAUDE.md is
            # the instructions every session loads, and being wrong about it is
            # not the same kind of cheap as being wrong about a plan document.
            echo "Result: docs/ only — skipping the build, the suites and the deploy."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Laravel is the only PHP left, so this is Pint and nothing else. It used to
  # also run `php -l` over app/ and PHP_CodeSniffer against phpcs.xml; both went
  # with the old front end and its root Composer project.
  lint-api:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      # Pint is pinned by api/composer.lock and lives in api/vendor/.
      # --no-scripts skips Laravel's post-autoload-dump `artisan
      # package:discover`, which Pint doesn't need.
      - name: Install Laravel API dev tools
        run: composer install --no-interaction --no-progress --no-scripts --working-dir=api
      # Same check as `npm run lint:api`, invoked natively: CI calls the binary
      # directly, while the npm script is the local Docker-or-native wrapper
      # (tools/pint.mjs).
      - name: Laravel Pint (api/)
        working-directory: api
        run: vendor/bin/pint --test

  # The Laravel API's PHPUnit suite (api/phpunit.xml) — the only test suite with
  # a database left, now that the old app's `tests` job is gone. Kept separate
  # from `lint-api` so it runs concurrently: it needs its own database
  # (laravel_api_test must stay dedicated — RefreshDatabase drops every table)
  # and its own Composer install, and folding it in would serialise install + DB
  # startup + suite onto the lint job, lengthening deploy-test's critical path
  # for no gain.
  tests-api:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The reporting steps at the end of this job publish a check and a PR
    # comment; they moved here from the deleted `tests` job along with its
    # permissions.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    services:
      mariadb:
        # 10.3 matches prod (10.3.8) and the local stack's `db` service, so the
        # migrations run against the same engine everywhere. The image grants
        # MARIADB_USER all rights on MARIADB_DATABASE — the whole of what
        # docker/db/init/00-databases.sql does locally for this database. No
        # seeding: RefreshDatabase builds the schema from Laravel's migrations,
        # including the `cache` table that CACHE_STORE=database needs for the
        # Altcha replay guard.
        image: mariadb:10.3
        env:
          MARIADB_DATABASE: laravel_api_test
          MARIADB_USER: canetons
          MARIADB_PASSWORD: canetons
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # Laravel talks to MariaDB over PDO, and pdo_mysql is not in
          # setup-php's default set. Every other extension the api/composer.lock
          # tree requires is.
          extensions: pdo_mysql
          tools: composer
      # The api install is the slow part of this job and now happens in two
      # jobs (here and `php`). Cache Composer's download cache, keyed by the
      # lockfile; a miss just falls back to a full install. The root installs in
      # `php`/`tests` are still uncached — worth doing, but that means editing
      # existing jobs, so it is left as a separate change.
      - name: Cache Composer downloads (api/)
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-api-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-api-
      # Same install as the `php` job's Pint step. --no-scripts skips Laravel's
      # `artisan package:discover`; PackageManifest rebuilds
      # bootstrap/cache/packages.php lazily on first boot, so the suite is
      # unaffected (verified locally by deleting the manifest and re-running).
      - name: Install Laravel API dependencies
        run: composer install --no-interaction --no-progress --no-scripts --working-dir=api
      - name: PHPUnit (api/)
        working-directory: api
        env:
          # api/phpunit.xml pins DB_HOST=db, the compose service name, which
          # does not resolve on a runner. PHPUnit's <env> entries default to
          # force="false" and only putenv() when getenv() returns false
          # (src/TextUI/Configuration/PhpHandler.php:140 in phpunit 12.5.31), so
          # a variable already in the process environment wins. Overriding here
          # leaves phpunit.xml correct for local dev, where the suite runs
          # inside the web container. Service-container ports are published on
          # the runner's loopback, so 127.0.0.1 — same as the `tests` job.
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          # No .env exists on a runner: api/.env is git-ignored and the local
          # stack mounts docker/api/env.docker over it. Without APP_KEY the
          # encrypter throws "No application encryption key has been specified"
          # and every cookie/session test fails. Throwaway CI-only key, public
          # on purpose exactly like the one in docker/api/env.docker — it signs
          # nothing that outlives the job, and must never be used on a server.
          APP_KEY: base64:oxt8P89lrI3WQgV89r3v9/9NNrgLipYqKNezzVvHmyk=
        run: vendor/bin/phpunit --log-junit=junit.xml
      - uses: actions/setup-node@v5
        if: always()
        with:
          node-version: "22"
      - name: Test result summary
        if: always()
        run: node tools/phpunit-summary.mjs api/junit.xml | tee test-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment test summary on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: phpunit
          path: test-summary.md
      - name: Publish PHPUnit check
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: api/junit.xml
          check_name: PHPUnit (api/)
          detailed_summary: true
          include_passed: false

  assets:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Node dev tools
        run: npm ci
      - name: JS unit tests
        run: npm run test:js
      - name: Type-check
        run: npm run typecheck
      - name: Frontend unit tests
        run: npm run test:web
      - name: ESLint
        run: npm run lint:js
      - name: Stylelint
        run: npm run lint:css
      - name: Prettier
        run: npm run format:check

  # Playwright, in a real browser. SEPARATE FROM `assets` ON PURPOSE: it needs a
  # browser download and its own dev server, which is a minute of setup no other
  # frontend check should have to wait behind.
  #
  # WHY THIS CAN RUN IN CI AT ALL. playwright.config.ts starts the dev server
  # with `--mode mock`, which loads web/.env.mock and serves MSW's mocked
  # backend — no Docker, no MariaDB, no Laravel. The host firewalls this runner
  # (see CLAUDE.md), so nothing that needs the real stack could run here anyway.
  #
  # WHAT IT THEREFORE IS NOT: proof of the API contract. It is a real browser
  # against real routing, guards, layout and rendering; the contract is
  # `tests-api` and `openapi-drift`. Do not let a green run here be read as "the
  # API works".
  #
  # This suite existed from E1 onwards but ran in NO workflow, so a broken spec
  # reached main unnoticed at least once. `npm run test:web` does not cover
  # web/e2e/ — the two suites are separate runners over separate directories.
  e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Node dev tools
        run: npm ci
      # Chromium only. playwright.config.ts is deliberately a smoke harness with
      # one browser and one project, so the other engines would be a pure
      # download cost. --with-deps pulls the OS libraries the browser needs.
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      # The config's webServer starts Vite on :5174 and tears it down after.
      # Its reuseExistingServer is `!process.env.CI`, and Actions sets CI=true,
      # so this always gets a server of its own rather than adopting a stray.
      - name: End-to-end tests
        run: npm run test:e2e

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Secret / prod-data guard
        run: node tools/secret-guard.mjs

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Node dev tools
        run: npm ci
      - name: Build deploy artifact
        run: npm run build
      # The deployed document root is exactly the SPA shell plus api-laravel/.
      # Asserting both catches the build-order bug tools/build.mjs warns about:
      # if Vite ran after the Laravel copy it would empty the outDir and
      # api-laravel/ would be missing here.
      - name: Verify dist/build/ was produced
        run: test -f dist/build/index.html && test -d dist/build/api-laravel/vendor

  # The generated client must never lag behind the API. Regenerating and diffing
  # is the only check that catches a changed response shape: types that describe
  # a response the API no longer sends fail nothing at runtime until a member
  # sees a broken page. Kept separate from `tests-api` for the same reason that
  # job is separate from `php`: this needs its own Composer/Node install and a
  # SQLite export step (see tools/openapi.mjs) unrelated to what tests-api runs.
  openapi-drift:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # tools/openapi.mjs runs the actual export inside a php:8.4-cli
          # Docker container when a daemon is reachable (see
          # tools/php-in-docker.mjs) — true on GitHub-hosted ubuntu-latest
          # runners, and that image was confirmed locally to already carry
          # pdo_sqlite/sqlite3. These two are declared anyway for the local-php
          # fallback path (no Docker daemon), the same belt-and-suspenders
          # reasoning as tests-api declaring pdo_mysql above: none of them is in
          # setup-php's default set.
          extensions: pdo_sqlite, sqlite3
          tools: composer
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Node dev tools
        run: npm ci
      # Same install as the `php` job's Pint step and tests-api's PHPUnit step.
      # Pre-installing here means the Docker-run export below (which bind-mounts
      # the repo) finds api/vendor already populated instead of installing it
      # again inside the container.
      - name: Install Laravel API dependencies
        run: composer install --no-interaction --no-progress --no-scripts --working-dir=api
      - name: Regenerate the OpenAPI document
        run: npm run openapi
      - name: Regenerate the API client
        run: npm run generate:api
      # Scoped to exactly the two generated artifacts: a stale api/openapi.json
      # or a stale web/src/api/generated must fail this step, but unrelated
      # working-tree noise (api/vendor/ is gitignored anyway, package-lock.json,
      # etc.) must not.
      - name: Fail if either is out of date
        run: |
          if ! git diff --exit-code -- api/openapi.json web/src/api/generated; then
            echo "::error::api/openapi.json or the generated client is stale. Run 'npm run openapi && npm run generate:api' and commit the result."
            exit 1
          fi
      - name: Type-check
        run: npm run typecheck
      - name: Frontend unit tests
        run: npm run test:web

  # Auto-deploy the built artifact to the TEST staging site on merge to main,
  # only after every other job is green. The FTP account can also reach qa/prod,
  # so: secrets live in the `test` GitHub Environment (add protection rules
  # there), deploy-test hard-refuses any target path without "test", and the
  # mirror's deletions are bounded by the mass-delete safety brake (exit 2).
  deploy-test:
    runs-on: ubuntu-latest
    needs: [lint-api, tests-api, assets, e2e, guard, build, openapi-drift]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Install Node dev tools
        run: npm ci
      - name: Deploy to TEST over FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: npm run deploy:test
