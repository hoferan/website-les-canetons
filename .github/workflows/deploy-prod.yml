name: Deploy PROD

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pass --dry-run to preview the deploy plan without changing anything"
        type: boolean
        default: false
      force:
        description: "Pass --force to re-upload every file, even ones that appear unchanged"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The script imports nothing outside Node, so no npm ci.
      - name: Verify this commit is the one QA is running
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/deploy/qa-gate.mjs

  deploy:
    needs: [validate-qa]
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      dry_run: ${{ inputs.dry_run }}
      force: ${{ inputs.force }}
    secrets: inherit
