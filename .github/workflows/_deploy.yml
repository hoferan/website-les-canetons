name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "Which environment to deploy to (test, qa, or prod)"
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
      force:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Install Node dev tools
        run: npm ci

      - name: Deploy over FTP
        id: deploy
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -o pipefail
          rc=0
          npm run deploy:${{ inputs.environment }} -- \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            2>&1 | tee deploy-output.log || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy to ${{ inputs.environment }}"
            echo "- Ref: \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA}\`)"
            echo "- Flags: dry-run=${{ inputs.dry_run }}, force=${{ inputs.force }}"
            if [ "${{ steps.deploy.outputs.exit_code }}" = "2" ]; then
              echo "- ⛔ Refused by a guard or the mass-delete safety brake (exit 2) — deletion list in the log below."
            fi
            if [ -f deploy-output.log ]; then
              grep -E 'deploy done in|^\(dry-run\)|^FAILED' deploy-output.log || true
              echo ""
              echo "<details><summary>Full deploy log</summary>"
              echo ""
              echo '```'
              cat deploy-output.log
              echo '```'
              echo "</details>"
            else
              echo ""
              echo "_No deploy output captured — the deploy step did not run or failed before producing output._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
