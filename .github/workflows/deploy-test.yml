name: Deploy TEST

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pass --dry-run to preview the deploy plan without changing anything"
        type: boolean
        default: false
      force:
        description: "Pass --force to re-upload every file, even ones that appear unchanged"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: test
      dry_run: ${{ inputs.dry_run }}
      force: ${{ inputs.force }}
    secrets: inherit
